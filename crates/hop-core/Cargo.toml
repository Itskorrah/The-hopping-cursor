[package]
name = "hop-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
snow = "0.9"
sha2 = "0.10"
hex = "0.4"
bincode = "1.3"
mdns-sd = "0.13"
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
arboard = "3.6"
display-info = "0.5"
png = "0.17"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
