name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p hop-core -p hopping-cursor --all-targets -- -D warnings
      - run: cargo test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: apps/desktop/test-results
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            label: windows-x64
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
            label: macos-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            bundles: dmg
            label: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo test -p hop-core
      - run: npm run tauri -w apps/desktop -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify installer exists
        shell: bash
        run: |
          shopt -s nullglob
          hop_installers=(target/${{ matrix.target }}/release/bundle/${{ matrix.bundles }}/*.{exe,dmg})
          test "${#hop_installers[@]}" -gt 0
      - uses: actions/upload-artifact@v4
        with:
          name: hopping-cursor-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            LICENSE
            apps/desktop/public/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
